[project]
name = "snakktilmeg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
    "pynput>=1.8.1",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest==8.2.2",
    "pytest-mock>=3.14.1",
]

[tool.pytest.ini_options]
addopts = "-p no:debugging"
pythonpath = ["."]
markers = [
    "integration: tests that require external binaries, hardware, or local machine setup",
]
